<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A time tracking dashboard compares a user's activities in a certain timeframe"
    />
    <meta
      name="keywords"
      content="HTML, CSS, Javascript, Mobile design, Desktop design, JSON"
    />
    <meta name="author" content="Rupali Roy Choudhury" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="main.js" defer></script>
    <title>Frontend Mentor | Time tracking dashboard</title>
  </head>
  <body>
    <div class="wrapper">
      <h1 class="visually-hidden">Dashboard</h1>

      <!-- Main card -->

      <article class="dashboard">
        <section class="card card-background-7">
          <div class="main-background-1">
            <img
              src="./images/image-jeremy.png"
              alt="Profile pic of Jeremy"
              width="64"
              height="64"
            />
            <div class="flex-style-3">
              <label for="full-name" class="text-style-1">Report for</label>
              <em name="full-name" class="text-style-2">Jeremy Robson</em>
            </div>
          </div>
          <ul>
            <li><a href="#" onclick="">Daily</a></li>
            <li><a href="#" onclick="">Weekly</a></li>
            <li><a href="#" onclick="">Monthly</a></li>
          </ul>
        </section>
        <!-- Work -->
        <section class="card card-background-1">
          <div class="sub-section-1">
            <img
              src="./images/icon-work.svg"
              alt=""
              role="presentation"
              width="79"
              height="79"
            />
          </div>
          <div class="sub-section-2">
            <div class="flex-style-2">
              <h2 class="text-style-3">Work</h2>
              <button aria-label="More options" class="btn-style-1">
                <img
                  src="./images/icon-ellipsis.svg"
                  alt=""
                  role="presentation"
                  width="21"
                  height="5"
                />
              </button>
            </div>
            <div class="flex-style-1">
              <em class="text-style-4">32hrs</em>
              <p class="text-style-1">Last Week - 36hrs</p>
            </div>
          </div>
        </section>

        <!-- Play -->
        <section class="card card-background-2">
          <div class="sub-section-1">
            <img
              src="./images/icon-play.svg"
              alt=""
              role="presentation"
              width="76"
              height="77"
            />
          </div>
          <div class="sub-section-2">
            <div class="flex-style-2">
              <h2 class="text-style-3">Play</h2>
              <button aria-label="More options" class="btn-style-1">
                <img
                  src="./images/icon-ellipsis.svg"
                  alt=""
                  role="presentation"
                  width="21"
                  height="5"
                />
              </button>
            </div>
            <div class="flex-style-1">
              <em class="text-style-4">10hrs</em>
              <p class="text-style-1">Last Week - 8hrs</p>
            </div>
          </div>
        </section>

        <!-- Study -->
        <section class="card card-background-3">
          <div class="sub-section-1">
            <img
              src="./images/icon-study.svg"
              alt=""
              role="presentation"
              width="79"
              height="79"
            />
          </div>
          <div class="sub-section-2">
            <div class="flex-style-2">
              <h2 class="text-style-3">Study</h2>
              <button aria-label="More options" class="btn-style-1">
                <img
                  src="./images/icon-ellipsis.svg"
                  alt=""
                  role="presentation"
                  width="21"
                  height="5"
                />
              </button>
            </div>
            <div class="flex-style-1">
              <em class="text-style-4">4hrs</em>
              <p class="text-style-1">Last Week - 7hrs</p>
            </div>
          </div>
        </section>

        <!-- Exercise -->
        <section class="card card-background-4">
          <div class="sub-section-1">
            <img
              src="./images/icon-exercise.svg"
              alt=""
              role="presentation"
              width="81"
              height="55"
            />
          </div>
          <div class="sub-section-2">
            <div class="flex-style-2">
              <h2 class="text-style-3">Exercise</h2>
              <button aria-label="More options" class="btn-style-1">
                <img
                  src="./images/icon-ellipsis.svg"
                  alt=""
                  role="presentation"
                  width="21"
                  height="5"
                />
              </button>
            </div>
            <div class="flex-style-1">
              <em class="text-style-4">4hrs</em>
              <p class="text-style-1">Last Week - 5hrs</p>
            </div>
          </div>
        </section>

        <!-- Social -->
        <section class="card card-background-5">
          <div class="sub-section-1">
            <img
              src="./images/icon-social.svg"
              alt=""
              role="presentation"
              width="75"
              height="100"
            />
          </div>
          <div class="sub-section-2">
            <div class="flex-style-2">
              <h2 class="text-style-3">Social</h2>
              <button aria-label="More options" class="btn-style-1">
                <img
                  src="./images/icon-ellipsis.svg"
                  alt=""
                  role="presentation"
                  width="21"
                  height="5"
                />
              </button>
            </div>
            <div class="flex-style-1">
              <em class="text-style-4">5hrs</em>
              <p class="text-style-1">Last Week - 10hrs</p>
            </div>
          </div>
        </section>

        <!-- Self Care -->
        <section class="card card-background-6">
          <div class="sub-section-1">
            <img
              src="./images/icon-self-care.svg"
              alt=""
              role="presentation"
              width="67"
              height="67"
            />
          </div>
          <div class="sub-section-2">
            <div class="flex-style-2">
              <h2 class="text-style-3">Self Care</h2>
              <button aria-label="More options" class="btn-style-1">
                <img
                  src="./images/icon-ellipsis.svg"
                  alt=""
                  role="presentation"
                  width="21"
                  height="5"
                />
              </button>
            </div>
            <div class="flex-style-1">
              <em class="text-style-4">2hrs</em>
              <p class="text-style-1">Last Week - 2hrs</p>
            </div>
          </div>
        </section>
      </article>
    </div>
  </body>
</html>
